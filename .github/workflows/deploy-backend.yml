name: Deploy Backend to Azure

on:
  push:
    branches: [main]
    paths: [backend/**]

env:
  BACKEND_NAME: innoira-api
  AZURE_RG: rg-innoira

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pre-install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt --target=/tmp/backend-vendor
          pip install cryptography==42.0.8 --target=/tmp/backend-vendor \
            --only-binary=:all: --platform manylinux_2_17_x86_64 \
            --python-version 3.11 --implementation cp --force-reinstall --no-deps

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure app (Oryx off, PYTHONPATH set)
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.AZURE_RG }} \
            --name ${{ env.BACKEND_NAME }} \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              PYTHONPATH=/home/site/wwwroot/vendor

      - name: Package and deploy backend
        run: |
          cd backend
          rm -f deploy.zip backend-deploy.zip
          mkdir -p vendor
          cp -r /tmp/backend-vendor/* vendor/
          zip -r /tmp/deploy.zip . \
            -x "*__pycache__*" "*venv*" "*.venv*" ".git*" "*.log" "*.err" ".env" "deploy.zip" "backend-deploy.zip"
          az webapp deploy \
            --resource-group ${{ env.AZURE_RG }} \
            --name ${{ env.BACKEND_NAME }} \
            --src-path /tmp/deploy.zip \
            --type zip \
            --timeout 900 \
            --verbose

      - name: Verify deployment
        run: |
          echo "Waiting for backend to start..."
          for i in $(seq 1 24); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.BACKEND_NAME }}.azurewebsites.net/health 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "Backend is up (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i: HTTP $status — waiting..."
            sleep 10
          done
          echo "Backend failed to start within 4 minutes"
          exit 1
